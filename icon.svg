<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Corona de Ceniza">
  <title>Corona de Ceniza</title>
  <defs>
    <radialGradient id="field" cx="50%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#1a1612"/>
      <stop offset="100%" stop-color="#0b0b11"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#edd89a"/>
      <stop offset="42%" stop-color="#c6a45b"/>
      <stop offset="100%" stop-color="#7d5e28"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0%" stop-color="#f0dd9a"/>
      <stop offset="55%" stop-color="#c6a45b"/>
      <stop offset="100%" stop-color="#8a6a32"/>
    </linearGradient>
    <radialGradient id="ember" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffe2a0"/>
      <stop offset="35%" stop-color="#e07030"/>
      <stop offset="100%" stop-color="#5a140c"/>
    </radialGradient>
    <radialGradient id="ash" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#4a453c"/>
      <stop offset="100%" stop-color="#1c1a18"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#field)"/>
  <circle cx="64" cy="64" r="40" fill="#12100e"/>
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#ring)" stroke-width="3.2"/>
  <circle cx="64" cy="64" r="42.2" fill="none" stroke="#3a3326" stroke-width=".8"/>

  <ellipse cx="64" cy="88" rx="27" ry="11" fill="url(#ash)"/>
  <ellipse cx="50" cy="86" rx="13" ry="7" fill="#2e2a24"/>
  <ellipse cx="78" cy="87" rx="11" ry="6" fill="#161412"/>
  <ellipse cx="64" cy="84" rx="8" ry="4" fill="#3d3428"/>

  <!-- mural crown: three merlons, palace not diadem -->
  <path fill="url(#gold)" d="
    M36 70
    L36 58 L40 58 L40 50 L52 50 L52 58
    L56 58 L56 42 L72 42 L72 58
    L76 58 L76 50 L88 50 L88 58 L92 58
    L92 80 L36 80 Z"/>
  <rect x="36" y="70" width="56" height="3" fill="#f0dd9a" opacity=".32"/>
  <rect x="41" y="74.5" width="5" height="3" rx="1" fill="#7d5e28"/>
  <rect x="82" y="74.5" width="5" height="3" rx="1" fill="#7d5e28"/>

  <!-- crack: the crown already failed once -->
  <path d="M63 42.2 L65 42.2 L66.4 69 L61.6 69 Z" fill="#1a120c"/>
  <path d="M63.5 42.6 L64.5 42.6 L65.4 63 L62.6 63 Z" fill="url(#ember)"/>

  <circle cx="64" cy="86" r="7.5" fill="#e07030" opacity=".28"/>
  <circle cx="64" cy="86" r="4.2" fill="url(#ember)"/>
  <circle cx="62.8" cy="84.8" r="1.4" fill="#ffe8b8"/>

  <circle cx="43" cy="40" r="1.3" fill="#8a8274" opacity=".75"/>
  <circle cx="86" cy="46" r="1.1" fill="#6f685c" opacity=".65"/>
  <circle cx="36" cy="56" r=".9" fill="#7a7368" opacity=".55"/>
</svg>
