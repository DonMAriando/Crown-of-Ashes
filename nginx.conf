server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
        audio/ogg opus;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml audio/ogg;

    # HTML, manifiesto y service worker: el jugador tiene que ver el cache bump.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location ~* \.(html|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
